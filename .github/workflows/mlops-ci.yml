name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─────────────────────────────────────────
  # Job 1: Lint and Test
  # ─────────────────────────────────────────
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8 linting
        run: |
          flake8 . --max-line-length=120 --exclude=.git,__pycache__,*.egg-info --ignore=E402,F401,W292,F541,E501,W504,E722

      - name: Run pytest unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Check model accuracy gate
        run: |
          set +e
          python model/train.py --check-accuracy
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "No data yet — skipping accuracy gate."
          elif [ $code -ne 0 ]; then
            echo "❌ Accuracy gate FAILED — model accuracy below 0.80 threshold."
            exit 1
          else
            echo "✅ Accuracy gate passed."
          fi

  # ─────────────────────────────────────────
  # Job 2: Build and Push Docker Image
  # ─────────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mlops-app:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/mlops-app:${{ github.sha }} \
                       -f serving/Dockerfile .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mlops-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mlops-app:${{ github.sha }}

  # ─────────────────────────────────────────
  # Job 3: Deploy to AWS EC2
  # ─────────────────────────────────────────
  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/mlops-app:latest
            docker stop mlops-app || true
            docker rm mlops-app || true
            docker run -d \
              --name mlops-app \
              --restart unless-stopped \
              -p 8000:8000 \
              -e SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
              ${{ secrets.DOCKER_USERNAME }}/mlops-app:latest

      - name: Verify deployment health check
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:8000/health)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP $HTTP_STATUS)"
          else
            echo "❌ Health check FAILED (HTTP $HTTP_STATUS)"
            exit 1
          fi